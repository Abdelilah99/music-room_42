name: Merge Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, dev]

jobs:
  author-ready:
    name: author-ready
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Enforce author-only merge
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          EVENT="${{ github.event.action }}"
          LABEL="${{ github.event.label.name }}"

          API="https://api.github.com"
          AUTH=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")

          # If the ready-to-merge label was just added, check who added it
          if [ "$EVENT" = "labeled" ] && [ "$LABEL" = "ready-to-merge" ]; then
            if [ "$ACTOR" != "$PR_AUTHOR" ]; then
              PERMISSION=$(curl -sf "${AUTH[@]}" \
                "$API/repos/$REPO/collaborators/$ACTOR/permission" \
                | jq -r '.permission // "none"' 2>/dev/null || echo "none")
              if [ "$PERMISSION" != "admin" ]; then
                curl -sf -X DELETE "${AUTH[@]}" \
                  "$API/repos/$REPO/issues/$PR_NUMBER/labels/ready-to-merge"
                curl -sf -X POST "${AUTH[@]}" \
                  "$API/repos/$REPO/issues/$PR_NUMBER/comments" \
                  -d "{\"body\":\"Only the PR author (@$PR_AUTHOR) or a repository admin can add the \`ready-to-merge\` label.\"}"
                echo "Unauthorized - label removed"
                exit 1
              fi
            fi
          fi

          # Check if the label is present
          HAS_LABEL=$(curl -sf "${AUTH[@]}" \
            "$API/repos/$REPO/issues/$PR_NUMBER/labels" \
            | jq -r 'map(.name) | contains(["ready-to-merge"])')

          if [ "$HAS_LABEL" = "true" ]; then
            echo "PR $PR_NUMBER is approved for merge by its author"
            exit 0
          fi

          echo "Waiting for @$PR_AUTHOR to add the 'ready-to-merge' label"
          exit 1
